# Configuration for request-service, read by Spring Boot at startup.
# Values like ${DB_URL:...} come from the .env file (or environment variables), with the default after the colon.

spring.application.name=request-service
# Lets Spring read KEY=value pairs from the .env file in the folder you run from
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/floodlink}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# "update" creates/updates tables from the entity classes, so no SQL scripts are needed
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT secret: must be IDENTICAL to auth-realtime-service (which issues the tokens) and insights-service
app.jwt.secret=${JWT_SECRET:floodlink-demo-secret-change-me-0123456789}

# Other services
app.insights-service.url=${INSIGHTS_SERVICE_URL:http://localhost:5001}
# How long to wait for insights-service. Its priority score comes from a local LLM, so keep this above OLLAMA_TIMEOUT_SECONDS
app.insights-service.read-timeout-ms=${INSIGHTS_READ_TIMEOUT_MS:60000}
app.realtime-service.url=${REALTIME_SERVICE_URL:http://localhost:5000}
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# Actuator + Swagger
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
