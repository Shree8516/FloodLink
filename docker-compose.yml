# OPTIONAL: starts only the two databases (PostgreSQL for request-service, MongoDB for auth-realtime-service) for people who don't want to install them.
# The four services still run with the plain commands in README.md.  Usage: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: floodlink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  postgres-data:
  mongo-data:
